<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bondrucker – Live-Ansicht</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e7e9ee;
    --muted: #8b93a3; --accent: #ff6b35; --ok: #3ddc84;
    --paper: #fbfaf6; --ink: #1b1b1b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .head-right { display: flex; align-items: center; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #c0392b; }
  .chip.on i { background: var(--ok); }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px;
    padding: 24px; max-width: 1000px; margin: 0 auto;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }

  /* Drucker und Papier */
  .stage {
    display: flex; flex-direction: column; align-items: center;
    font: 13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #status {
    font: 14px/1.4 system-ui, sans-serif; color: var(--muted); margin-bottom: 14px; min-height: 20px;
  }
  .viewport {
    width: calc(var(--w, 42) * 1ch + 40px); max-width: 100%; height: 480px;
    overflow: hidden; display: flex; align-items: flex-end; justify-content: center;
  }
  .viewport.done { align-items: flex-start; overflow-y: auto; }
  .paper {
    width: 100%; background: var(--paper); color: var(--ink);
    padding: 16px 20px 8px; will-change: transform;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 8px 30px rgba(0, 0, 0, .4);
  }
  .paper:empty { display: none; }
  .paper.cut { animation: tear .7s ease; border-bottom: 2px dashed #cfcabb; }
  .ln { white-space: pre; height: 20px; }
  .ln.bold, .ln.title { font-weight: 700; }
  @keyframes tear {
    0% { transform: translateY(0); }
    35% { transform: translateY(-9px) rotate(-.8deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  .printer {
    position: relative; z-index: 3; margin-top: -10px; height: 110px;
    width: calc(var(--w, 42) * 1ch + 110px); max-width: 100%;
    border-radius: 16px 16px 22px 22px; border: 1px solid #384050;
    background: linear-gradient(#2d323d, #1b1f27);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 22px;
    font: 12px system-ui, sans-serif; color: var(--muted); letter-spacing: .12em;
  }
  .slot {
    position: absolute; top: -1px; left: 16px; right: 16px; height: 12px;
    background: #07080b; border-radius: 0 0 8px 8px; box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .8);
  }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #3a4150; }
  .ready .led { background: var(--ok); }
  .printing .led { background: var(--accent); animation: blink .45s infinite alternate; }
  .printing .printer { animation: buzz .09s infinite; }
  @keyframes blink { from { opacity: 1; } to { opacity: .25; } }
  @keyframes buzz { 0% { transform: translateX(0); } 50% { transform: translateX(.6px); } 100% { transform: translateX(-.6px); } }

  /* Verlauf */
  aside h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  #history { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow-y: auto; }
  .h {
    display: flex; justify-content: space-between; align-items: center; text-align: left; width: 100%;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
  }
  .h span:last-child { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Bondrucker – Live-Ansicht</h1>
  <div class="head-right">
    <span class="chip" id="conn"><i></i><span id="conn-text">Verbinde …</span></span>
    <button id="demo">Testbon</button>
  </div>
</header>

<main>
  <section class="stage" id="stage">
    <div id="status">Warte auf Bestellungen …</div>
    <div class="viewport" id="viewport"><div class="paper" id="paper"></div></div>
    <div class="printer">
      <div class="slot"></div>
      <span>BON-DRUCKER</span>
      <div class="led"></div>
    </div>
  </section>

  <aside>
    <h2>Verlauf</h2>
    <div id="history"><div class="empty">Noch keine Bons.</div></div>
  </aside>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), viewport = $('#viewport'), paper = $('#paper');
  const hist = $('#history'), statusEl = $('#status');
  const LH = 20;                      // Zeilenhöhe in px, passend zum CSS
  let history = [], queue = [], busy = false, lastDone = 0;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function resetPaper(width) {
    paper.replaceChildren();
    paper.className = 'paper';
    paper.style.transition = 'none';
    paper.style.transform = '';
    viewport.classList.remove('done');
    stage.style.setProperty('--w', width);
  }

  function makeLine(l) {
    const d = document.createElement('div');
    d.className = 'ln' + (l.s && l.s !== 'normal' ? ' ' + l.s : '');
    d.textContent = l.t || ' ';
    return d;
  }

  // Neue Zeile erscheint unten am Schlitz und schiebt das Papier nach oben.
  function feedLine(l, ms) {
    paper.appendChild(makeLine(l));
    const first = paper.children.length === 1;
    const dist = first ? paper.offsetHeight : LH;
    paper.style.transition = 'none';
    paper.style.transform = `translateY(${dist}px)`;
    void paper.offsetHeight;
    paper.style.transition = `transform ${ms}ms linear`;
    paper.style.transform = 'translateY(0)';
  }

  function finish() {
    paper.classList.add('cut');
    if (paper.offsetHeight > viewport.clientHeight) viewport.classList.add('done');
  }

  async function play(r) {
    resetPaper(r.width);
    stage.classList.remove('ready');
    stage.classList.add('printing');
    statusEl.textContent = `Druckt Bestellung ${r.orderNo} …`;
    const ms = r.lineMs || 140;
    for (const l of r.lines) {
      feedLine(l, ms);
      await sleep(ms);
    }
    stage.classList.remove('printing');
    paper.style.transition = 'none';
    paper.style.transform = '';
    finish();
    await sleep(700);
    stage.classList.add('ready');
    statusEl.textContent = `Bestellung ${r.orderNo} gedruckt`;
    lastDone = Date.now();
  }

  function showStatic(r) {
    resetPaper(r.width);
    r.lines.forEach((l) => paper.appendChild(makeLine(l)));
    finish();
    stage.classList.add('ready');
    statusEl.textContent = `Bestellung ${r.orderNo} (Wiederholung)`;
  }

  async function next() {
    if (busy || !queue.length) return;
    busy = true;
    // Den vorherigen Bon noch kurz lesbar lassen, bevor der nächste druckt.
    await sleep(Math.max(0, 3500 - (Date.now() - lastDone)));
    await play(queue.shift());
    busy = false;
    next();
  }

  function renderHistory() {
    hist.replaceChildren();
    if (!history.length) {
      hist.innerHTML = '<div class="empty">Noch keine Bons.</div>';
      return;
    }
    for (const r of [...history].reverse()) {
      const b = document.createElement('button');
      b.className = 'h';
      const a = document.createElement('span');
      a.textContent = '#' + r.orderNo;
      const c = document.createElement('span');
      c.textContent = `${r.total} · ${r.time}`;
      b.append(a, c);
      b.onclick = () => { if (!busy) showStatic(r); };
      hist.appendChild(b);
    }
  }

  function setConn(on) {
    $('#conn').classList.toggle('on', on);
    $('#conn-text').textContent = on ? 'Verbunden' : 'Getrennt, verbinde neu …';
  }

  const es = new EventSource('/events');
  es.onopen = () => setConn(true);
  es.onerror = () => setConn(false);
  es.addEventListener('history', (e) => {
    history = JSON.parse(e.data);
    renderHistory();
    const last = history[history.length - 1];
    if (last && !busy && !queue.length && !paper.children.length) showStatic(last);
  });
  es.addEventListener('receipt', (e) => {
    const r = JSON.parse(e.data);
    history.push(r);
    renderHistory();
    queue.push(r);
    next();
  });

  $('#demo').onclick = () => fetch('/demo', { method: 'POST' });
</script>
</body>
</html>
